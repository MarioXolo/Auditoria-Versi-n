# Sitio de Nginx para el Sistema de Auditorías (lo instala deploy/provision.sh)
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    root __APP_DIR__/public;
    index index.php;

    charset utf-8;
    client_max_body_size 24M;   # fotos de evidencia y asistencia

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Archivos compilados (CSS/JS con hash) e imágenes públicas
    location ~* ^/(build|images)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHP__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Nada de archivos ocultos (.env, .git) ni otros .php
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
